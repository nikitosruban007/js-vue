<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 375px;
            gap: 19px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 20px;
        }

        select,
        input[type="number"],
        button {
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            font-size: 20px;
            padding: 0 12px;
        }

        label[for="discount"] {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        input[type="checkbox"] {
            width: 25px;
            height: 25px;
        }

        #costs {
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<form id="form">
    <label for="product">
        <select name="product" id="product" required>
            <option value="" disabled selected>Select a product</option>
            <option value="pc">PC</option>
            <option value="playstation">PlayStation</option>
            <option value="iphone">iPhone 13 Pro</option>
            <option value="samsung">Samsung 25 Ultra</option>
        </select>
    </label>

    <label for="quantity">
        <input
                type="number"
                name="quantity"
                id="quantity"
                placeholder="Quantity"
                required>
    </label>

    <label for="delivery">
        <select name="delivery" id="delivery" required>
            <option value="" disabled selected>Select type of delivery</option>
            <option value="courier">Courier</option>
            <option value="post">Post</option>
            <option value="self">Self-Pickup</option>
        </select>
    </label>

    <label for="discount">
        Do you have Discount Card?
        <input type="checkbox" name="discount" id="discount" required>
    </label>

    <button id="submit">Submit</button>

    <p id="costs"></p>
</form>


<script src="script.js"></script>

</body>
</html>
