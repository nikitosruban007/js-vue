<main class="profile" id="profile-card">
    <h1>Налаштування <em>профілю</em></h1>

    <div class="controls">
        <div class="field">
            <label for="profile-name">Ім’я</label>
            <input id="profile-name" type="text" autocomplete="nickname"
                   placeholder="Ім’я мандрівника" maxlength="40" required>
        </div>

        <div class="field">
            <label for="theme-select">Кольорова тема</label>
            <select id="theme-select">
                <option value="crimson">Багряний розлом</option>
                <option value="ember">Тліюче золото</option>
                <option value="ash">Холодний попіл</option>
            </select>
        </div>

        <button id="confirm-button" class="confirm" type="button">
            Підтвердити <span aria-hidden="true">→</span>
        </button>
    </div>

    <output id="profile-status" for="profile-name" aria-live="polite"></output>

    <button id="info-toggle" class="info-toggle" type="button"
            aria-expanded="false" aria-controls="profile-info">
        Додаткова інформація <span class="plus" aria-hidden="true"></span>
    </button>

    <section id="profile-info" class="info is-hidden" aria-label="Додаткова інформація">
        <p>Ім’я відображатиметься у профілі. Воно може містити до 40 символів.
            Кольорова тема змінює палітру інтерфейсу.</p>
    </section>
</main>
